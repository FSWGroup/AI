# Local development only. Production runs managed PostgreSQL (ADR-0030).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fsw
      POSTGRES_PASSWORD: fsw_local_dev
      POSTGRES_DB: fsw_layer0
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fsw -d fsw_layer0']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
