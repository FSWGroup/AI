# Units and quantity dimensions (ADR-0015).
#
# Codes follow UCUM so they are unambiguous and interoperable. Conversion is affine:
#   base = value * factorToBase + offsetToBase
#
# Two deliberate modelling choices worth understanding before editing this file:
#
# 1. Gauge and absolute pressure are SEPARATE DIMENSIONS, not a flag. Converting
#    between them requires ambient pressure and must be an explicit engineering
#    decision, never an implicit one. Industrial valve data ("WOG 600 PSI",
#    "150 psi working pressure") is almost always gauge, so PRESSURE_GAUGE is the
#    dimension most product attributes use.
#
# 2. TEMPERATURE and TEMPERATURE_DIFFERENCE are separate dimensions. 10 degC is
#    283.15 K; a 10 degC *difference* is 10 K. Conflating them is a classic bug.
#
# Factors for non-terminating conversions (degF, GPM, radians) are stored to 30
# significant digits. Round-trip tests assert equality to a documented tolerance.

dimensions:
  - code: PRESSURE_GAUGE
    name: Pressure (gauge)
    description: >-
      Pressure relative to ambient. What industrial product data means by "600 PSI"
      unless it explicitly says absolute. No conversion path to PRESSURE exists,
      because that conversion needs ambient pressure.
  - code: PRESSURE
    name: Pressure (absolute)
    description: Pressure relative to a perfect vacuum.
  - code: TEMPERATURE
    name: Temperature
    description: Absolute temperature. Affine conversion; see TEMPERATURE_DIFFERENCE.
  - code: TEMPERATURE_DIFFERENCE
    name: Temperature difference
    description: >-
      A temperature interval or tolerance. Scales without an offset, unlike a
      temperature. A 10 degC difference is 10 K, not 283.15 K.
  - code: LENGTH
    name: Length
    description: >-
      Measured physical length. NOT nominal pipe size, which is a designation, not a
      measurement (ADR-0016).
  - code: MASS
    name: Mass
    description: Mass, used for shipping and handling weights.
  - code: FLOW_VOLUMETRIC
    name: Volumetric flow
    description: Volume per unit time.
  - code: FLOW_COEFFICIENT
    name: Flow coefficient
    description: >-
      Valve capacity. Cv is the US convention (US gallons per minute of 60 degF water
      at 1 psi differential); Kv is the metric convention. Its own dimension because it
      is a defined coefficient, not a plain volumetric flow.
  - code: TORQUE
    name: Torque
    description: Actuator output and valve breakaway torque.
  - code: FORCE
    name: Force
    description: Linear actuator thrust.
  - code: VOLTAGE
    name: Voltage
    description: Electrical potential, for actuator and instrument supply.
  - code: CURRENT
    name: Current
    description: Electrical current, including 4-20 mA instrument loops.
  - code: POWER
    name: Power
    description: Electrical or mechanical power.
  - code: FREQUENCY
    name: Frequency
    description: Supply frequency.
  - code: AREA
    name: Area
    description: Cross-sectional and orifice areas.
  - code: VOLUME
    name: Volume
    description: Vessel and displacement volumes.
  - code: ANGLE
    name: Angle
    description: Rotation, for quarter-turn and multi-turn actuation.
  - code: TIME
    name: Time
    description: Stroke and response times.
  - code: DENSITY
    name: Density
    description: Fluid density, used in sizing calculations downstream of Layer 0.
  - code: DIMENSIONLESS
    name: Dimensionless
    description: Ratios and counts that still need a declared dimension.

