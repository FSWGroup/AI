# Nominal size is a DESIGNATION, not a measurement (ADR-0016, spec §29).
#
# NPS 1 does not mean 25.4 mm. NPS 1 pipe has an outside diameter of 1.315 in; the
# "1" is a designation within a sizing system, not a length. A system that normalizes
# nominal size into a length will eventually contribute to a misapplied valve.
#
# Terms therefore carry sizeSystem, designation and referenceStandard, plus a
# sortOrdinal so sizes order correctly without being numbers. The unit conversion
# service refuses any term from this vocabulary.
#
# Cross-system correspondence (NPS 1 ~ DN 25) is a conventional correspondence, not an
# identity, and is modelled as an explicit relationship rather than by giving both a
# shared numeric value.

key: nominal_size
name: Nominal size
description: >-
  Nominal pipe, tube and valve size designations. A designation within a sizing
  system, never a physical dimension.
isDesignation: true
designationKind: NOMINAL_SIZE
