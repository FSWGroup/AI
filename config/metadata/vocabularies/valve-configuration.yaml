description: How the valve is operated.
terms:
  - {
      code: MANUAL_LEVER,
      label: Manual lever,
      sortOrdinal: 10,
      aliases: [{ alias: 'lever' }, { alias: 'handle' }, { alias: 'lever handle' }],
    }
  - {
      code: MANUAL_GEAR,
      label: Manual gear operator,
      sortOrdinal: 20,
      aliases: [{ alias: 'gear' }, { alias: 'gear operated' }, { alias: 'worm gear' }],
    }
  - {
      code: MANUAL_HANDWHEEL,
      label: Manual handwheel,
      sortOrdinal: 30,
      aliases: [{ alias: 'handwheel' }, { alias: 'hand wheel' }],
    }
  - {
      code: PNEUMATIC,
      label: Pneumatic,
      sortOrdinal: 40,
      aliases: [{ alias: 'air actuated' }, { alias: 'air operated' }, { alias: 'pneu' }],
    }
  - {
      code: ELECTRIC,
      label: Electric,
      sortOrdinal: 50,
      aliases:
        [{ alias: 'motor operated' }, { alias: 'electric actuator' }, { alias: 'MOV' }],
    }
  - { code: HYDRAULIC, label: Hydraulic, sortOrdinal: 60 }
  - {
      code: SOLENOID,
      label: Solenoid,
      sortOrdinal: 70,
      aliases: [{ alias: 'solenoid operated' }],
    }
  - {
      code: SELF_OPERATED,
      label: Self-operated,
      sortOrdinal: 80,
      description: 'Operated by process pressure, as in a direct-acting regulator.',
    }
---
key: fail_position
name: Fail position
description: Where the valve goes on loss of motive power or signal.
terms:
  - {
      code: FAIL_CLOSED,
      label: Fail closed,
      sortOrdinal: 10,
      aliases:
        [
          { alias: 'FC' },
          { alias: 'NC' },
          { alias: 'normally closed' },
          { alias: 'spring to close' },
        ],
    }
  - {
      code: FAIL_OPEN,
      label: Fail open,
      sortOrdinal: 20,
      aliases:
        [
          { alias: 'FO' },
          { alias: 'NO' },
          { alias: 'normally open' },
          { alias: 'spring to open' },
        ],
    }
  - {
      code: FAIL_LAST,
      label: Fail in place,
      sortOrdinal: 30,
      aliases:
        [
          { alias: 'fail last' },
          { alias: 'FL' },
          { alias: 'double acting' },
          { alias: 'fail in position' },
        ],
    }
