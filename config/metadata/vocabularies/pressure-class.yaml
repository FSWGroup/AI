# Pressure class is a DESIGNATION, not a pressure (ADR-0016, spec §30).
#
# ASME Class 150 is not 150 PSI. It is a pressure-temperature rating designation whose
# allowable working pressure depends on material and temperature: a Class 150
# carbon-steel flange is rated around 285 psig at ambient and well under 150 psig at
# 750 F. The numeral in the designation is part of the name.
#
# `sortOrdinal` exists so classes order correctly for display and comparison. It is
# NOT a pressure and is never exposed as one. Measured pressures — working pressure,
# WOG rating, test pressure, set pressure — are QUANTITY attributes with a dimension.

key: pressure_class
name: Pressure class
description: >-
  Pressure-temperature rating class designations. Never a pressure value; see the
  working_pressure and wog_pressure attributes for measured pressures.
isDesignation: true
designationKind: PRESSURE_CLASS
