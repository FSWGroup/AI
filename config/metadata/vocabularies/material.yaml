# Materials of construction. One hierarchical vocabulary serves body, trim, seat, seal
# and gasket attributes; which values are sensible for which attribute is a data-quality
# question, not a vocabulary one.
#
# Aliases carry the distinction spec §28 requires. '316SS' and 'SS316' are the same
# thing, so they assert equivalence. 'CF8M' is the cast grade commonly supplied for 316
# service and is NOT the identical wrought material, so it normalizes without asserting
# equivalence and must carry a note saying why. The system normalizes messy source data
# without blindly declaring things equal.

key: material
name: Material
description: >-
  Materials of construction for bodies, trim, seats, seals and gaskets. Hierarchical:
  specific grades sit under their material family.
terms:
  - { code: METAL, label: Metal, sortOrdinal: 1000, description: Metallic materials. }
  - {
      code: POLYMER,
      label: Polymer,
      sortOrdinal: 2000,
      description: Rigid and semi-rigid plastics.,
    }
  - {
      code: ELASTOMER,
      label: Elastomer,
      sortOrdinal: 3000,
      description: Resilient sealing materials.,
    }
  - {
      code: CERAMIC,
      label: Ceramic,
      sortOrdinal: 4000,
      description: Ceramic and cermet materials.,
    }

  # --- Stainless steels ----------------------------------------------------
  - code: SS_316
    label: 316 stainless steel
    parent: METAL
    sortOrdinal: 1100
    description: Austenitic molybdenum-bearing stainless steel, wrought.
    aliases:
      - { alias: '316 SS' }
      - { alias: '316SS' }
      - { alias: 'SS316' }
      - { alias: 'SS 316' }
      - { alias: 'AISI 316' }
      - { alias: 'UNS S31600' }
      - alias: 'CF8M'
        assertsEquivalence: false
        confidence: 0.80
        note: >-
          CF8M is the cast equivalent grade (ASTM A351) commonly supplied for 316
          service. It is not the identical wrought material: composition ranges and
          mechanical properties differ. Normalize to 316 for search, but do not treat
          a CF8M casting and wrought 316 as interchangeable without engineering review.
      - alias: 'ASTM A351 CF8M'
        assertsEquivalence: false
        confidence: 0.80
        note: Cast grade; see the CF8M alias note.
  - code: SS_316L
    label: 316L stainless steel
    parent: METAL
    sortOrdinal: 1110
    description: Low-carbon 316, preferred where welding and intergranular corrosion matter.
    aliases:
      - { alias: '316L SS' }
      - { alias: 'SS316L' }
      - { alias: 'UNS S31603' }
      - alias: 'CF3M'
        assertsEquivalence: false
        confidence: 0.80
        note: Cast equivalent grade of 316L; not the identical wrought material.
  - code: SS_304
    label: 304 stainless steel
    parent: METAL
    sortOrdinal: 1120
    aliases:
      - { alias: '304 SS' }
      - { alias: 'SS304' }
      - { alias: 'UNS S30400' }
      - alias: 'CF8'
        assertsEquivalence: false
        confidence: 0.80
        note: Cast equivalent grade of 304; not the identical wrought material.
  - {
      code: SS_304L,
      label: 304L stainless steel,
      parent: METAL,
      sortOrdinal: 1130,
      aliases: [{ alias: 'SS304L' }, { alias: 'UNS S30403' }],
    }
  - {
      code: SS_17_4PH,
      label: 17-4 PH stainless steel,
      parent: METAL,
      sortOrdinal: 1140,
      aliases: [{ alias: '17-4PH' }, { alias: 'UNS S17400' }],
    }
  - {
