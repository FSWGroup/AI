# FSW WorkFit on Netlify.
#
# Required environment variables (Site settings → Environment variables):
#   DATABASE_URL              Postgres connection string (or use Netlify DB,
#                             which provides NETLIFY_DATABASE_URL automatically)
#   APP_SECRET                openssl rand -hex 32
#   STORAGE_PROVIDER          netlify   (recordings in Netlify Blobs)
#   BOOTSTRAP_ADMIN_EMAIL     first SUPER_ADMIN account (created on first build)
#   BOOTSTRAP_ADMIN_PASSWORD  its password (12+ characters)
#
# The build migrates the database, seeds assessment content idempotently,
# and builds the app. See docs/DEPLOY-NETLIFY.md for the full runbook.

[build]
  command = "node scripts/netlify-build.mjs"

[[plugins]]
  package = "@netlify/plugin-nextjs"
